# CONFIGURAÇÃO COMPLETA DO NGINX
# Substitua o conteúdo do seu arquivo de configuração ou adicione as novas locations

server {
    listen 80;
    listen 443 ssl http2;
    server_name br.permutapolicial.com.br permutapolicial.com.br;
    
    index index.html;
    root /www/wwwroot/br_permutapolicial/br.permutapolicial.com/public_html;
    
    include /www/server/panel/vhost/nginx/extension/br.permutapolicial.com.br/*.conf;

    # ============================================
    # 1. LANDING PAGES NEXT.JS (NOVO - ADICIONAR)
    # ============================================
    # Proxy para as landing pages Next.js (porta 3001)
    location /app/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Headers importantes para Next.js
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy para arquivos estáticos do Next.js (_next/static)
    location /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache para arquivos estáticos
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # 1b. LANDING PÚBLICA DE EDITAL (Open Graph / WhatsApp)
    # ============================================
    location ~ ^/edital/(\d+)/?$ {
        proxy_pass http://127.0.0.1:3000/api/editais/$1/share-page$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 2. API BACKEND (JÁ EXISTE - MANTER)
    # ============================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 3. FLUTTER WEB (SPA) — rotas client-side: /dashboard, /r/:codigo, /auth, etc.
    # Links de indicação: https://br.permutapolicial.com.br/r/SEUCODIGO
    # NÃO precisa proxy para /api — o app Flutter trata a rota após carregar index.html
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/br.permutapolicial.com.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/br.permutapolicial.com.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/br.permutapolicial.com.br/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    #referenced redirect rule, if commented, the configured redirect rule will be invalid
    include /www/server/panel/vhost/nginx/redirect/br.permutapolicial.com.br/*.conf;

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/br.permutapolicial.com.br.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # Flutter Web — copiar regras de nginx-flutter-web-perf.conf na raiz do repo
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /version-check.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        gzip on;
        gzip_vary on;
        gzip_types application/javascript text/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|mjs|wasm|woff2?|ttf|otf)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript application/wasm;
        gzip_comp_level 6;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~ .*\.(css)?$ {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/br.permutapolicial.com.br.log;
    error_log  /www/wwwlogs/br.permutapolicial.com.br.error.log;
}

