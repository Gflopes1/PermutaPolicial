# Configuração Nginx Simplificada para dev.br.permutapolicial.com.br
# Adicione este conteúdo ao arquivo de configuração do domínio dev

server {
    listen 80;
    server_name dev.br.permutapolicial.com.br;
    
    # Root para arquivos estáticos (ajuste o caminho conforme necessário)
    root /www/wwwroot/dev_permutapolicial/dev.br.permutapolicial.com/public_html;
    index index.html;
    
    # ============================================
    # PROXY PARA API BACKEND COM CORS
    # ============================================
    location /api/ {
        client_max_body_size 15m;

        # Proxy para o backend dev (porta 3001)
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Headers básicos do proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # ============================================
        # HEADERS CORS (ESSENCIAIS)
        # ============================================
        # O "always" garante que os headers sejam enviados mesmo em erros
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Handler para requisições OPTIONS (CORS Preflight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
    }
    
    # ============================================
    # LANDING PÚBLICA DE EDITAL (Open Graph / WhatsApp)
    # ============================================
    location ~ ^/edital/(\d+)/?$ {
        proxy_pass http://127.0.0.1:3001/api/editais/$1/share-page$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # ARQUIVOS ESTÁTICOS DO FLUTTER WEB
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|mjs|wasm|woff2?|ttf|otf)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Logs
    access_log /www/wwwlogs/dev.br.permutapolicial.com.br.log;
    error_log /www/wwwlogs/dev.br.permutapolicial.com.br.error.log;
}

