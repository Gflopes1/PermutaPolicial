# rewrite/br.permutapolicial.com.br.conf
# Caminho no servidor: /www/server/panel/vhost/rewrite/br.permutapolicial.com.br.conf
# Roteamento e proxy — location / SEMPRE por ultimo.
#
# NÃO coloque regras de cache aqui — ficam em br.permutapolicial.com.br.conf

# =========================================================
# 1. API (proxy reverso -> Node backend :3000)
# =========================================================
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location = /api {
    return 301 /api/;
}

# =========================================================
# 2. LANDING PUBLICA DE EDITAL (Open Graph / WhatsApp)
# =========================================================
location ~ ^/edital/(\d+)/?$ {
    proxy_pass http://127.0.0.1:3000/api/editais/$1/share-page$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# =========================================================
# 3. WEBSOCKET (Socket.IO)
# =========================================================
location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# =========================================================
# 4. FLUTTER WEB (SPA — SEMPRE POR ULTIMO)
# /dashboard, /auth, /r/CODIGO, etc.
# =========================================================
location / {
    try_files $uri $uri/ /index.html;
}
