# br.permutapolicial.com.br.conf — Permuta Policial (aaPanel)
# Caminho no servidor: /www/server/panel/vhost/nginx/br.permutapolicial.com.br.conf
#
# Regras de CACHE Flutter ficam AQUI (não no rewrite).
# O rewrite só roteia API / socket / SPA.

server {
    listen 80;
    listen 443 ssl http2;
    server_name dev.br.permutapolicial.com.br;

    # ============================================
    # CLOUDFLARE REAL IP
    # Restaura IP real do cliente para rate limits e logs
    # ============================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    index index.html;
    root /www/wwwroot/br_permutapolicial/br.permutapolicial.com/public_html;

    include /www/server/panel/vhost/nginx/extension/br.permutapolicial.com.br/*.conf;

    # ============================================
    # LANDINGS ESTATICAS POR FORCA (/app/pm, /app/bm, ...)
    # ============================================
    location ~ ^/app/(pm|bm|pc|prf|pf|gm)\.html$ {
        alias /www/wwwroot/br_permutapolicial/br.permutapolicial.com/public_html/html/$1.html;
    }

    location ~ ^/app/(pm|bm|pc|prf|pf|gm)$ {
        return 301 /app/$1.html;
    }

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/br.permutapolicial.com.br.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/br.permutapolicial.com.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/br.permutapolicial.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #referenced redirect rule, if commented, the configured redirect rule will be invalid
    include /www/server/panel/vhost/nginx/redirect/br.permutapolicial.com.br/*.conf;

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/br.permutapolicial.com.br.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known {
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ============================================
    # CACHE FLUTTER WEB (critico apos deploy)
    # Removido: location ~ .*\.(js|css)?$ { expires 12h; }
    # Esse bloco antigo cacheava main.dart.js e quebrava o painel deferred.
    # ============================================

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /version-check.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        gzip on;
        gzip_vary on;
        gzip_types application/javascript text/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Chunks deferred Flutter (.part.js) — mesmo nome a cada deploy; NÃO cachear agressivamente
    # DEVE vir ANTES do bloco generico de .js abaixo
    location ~* \.part\.js$ {
        gzip on;
        gzip_vary on;
        gzip_types application/javascript text/javascript;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Assets com hash no nome (/assets/*, wasm, fonts) — cache longo OK
    location ~* \.(js|mjs|wasm|woff2?|ttf|otf)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript application/wasm;
        gzip_comp_level 6;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.css$ {
        expires 12h;
        add_header Cache-Control "public" always;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/br.permutapolicial.com.br.log;
    error_log   /www/wwwlogs/br.permutapolicial.com.br.error.log;
}
