# Snippet Nginx — performance Flutter Web (Permuta Policial)
# Incluir no server block de br.permutapolicial.com.br e dev.br.permutapolicial.com.br
#
# Baseline produção (set/2026): main.dart.js ~5,9 MB (sem compressão no origin);
# Cloudflare entrega gzip. Estes blocos garantem cache longo + compressão no origin.

# index.html: sempre revalidar (deploy imediato)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

# version.json + version-check.js: detecção de nova build (sem cache agressivo)
location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location = /version-check.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Service worker FCM — sem cache agressivo
location = /firebase-messaging-sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Bundle principal Flutter — NUNCA immutable (mesmo nome a cada deploy; cache longo quebra deferred chunks)
location = /main.dart.js {
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /flutter.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# Chunks deferred Flutter (.part.js) — mesmo nome a cada deploy; NÃO cachear agressivamente
location ~* \.part\.js$ {
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# Assets Flutter versionados (WASM, fonts, /assets/* com hash no nome)
location ~* \.(js|mjs|wasm|woff2?|ttf|otf)$ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm;
    gzip_comp_level 6;

    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

# Imagens e ícones
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
}
